name: selfstudy-m2-demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: m2_db
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d m2_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  m1:
    build:
      context: ../backend/services/m1_mock
    ports:
      - "8081:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  m2:
    build:
      context: ../backend/services/m2
    environment:
      M2_DATABASE_URL: postgresql+psycopg2://app:app@postgres:5432/m2_db
      M2_M1_BASE_URL: http://m1:8000
      M2_M1_TIMEOUT_SECONDS: "3"
      M2_M1_DEMO_USER: admin
      M2_APPROVAL_TIMEOUT_SECONDS: "90"
      M2_SYNC_INTERVAL_SECONDS: "3"
      M2_SYNC_MAX_ATTEMPTS: "5"
      M2_JWT_SECRET: demo-only-secret-change-me
      M2_DEMO_MODE: "true"
      GIT_SHA: demo-local
      GIT_TAG: v0.1.0-demo
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      m1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
