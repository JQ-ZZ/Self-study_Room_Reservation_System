<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>M2 整教室预约与审批 · 演示</title>
<style>
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --brand: #2563eb;
    --brand-soft: #eff6ff;
    --green: #059669;
    --green-soft: #ecfdf5;
    --amber: #b45309;
    --amber-soft: #fffbeb;
    --red: #b91c1c;
    --red-soft: #fef2f2;
    --gray-soft: #f3f4f6;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.55;
  }
  header {
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 60%, #3b82f6 100%);
    color: #fff; padding: 22px 28px 18px;
  }
  header h1 { margin: 0; font-size: 21px; font-weight: 650; letter-spacing: .2px; }
  header .sub { margin-top: 4px; font-size: 13px; opacity: .85; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
    border-radius: 999px; background: rgba(255,255,255,.15); font-size: 12px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; }
  .dot.ok { background: #34d399; } .dot.bad { background: #f87171; } .dot.warn { background: #fbbf24; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 18px 20px 60px; }
  .loginbar {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-top: -8px; box-shadow: 0 4px 14px rgba(15, 23, 42, .05);
  }
  .loginbar .label { color: var(--muted); font-size: 12px; margin-right: 2px; }
  .userbtn {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 5px 12px; cursor: pointer; font-size: 12.5px; color: var(--ink);
  }
  .userbtn:hover { border-color: var(--brand); color: var(--brand); }
  .userbtn.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .who { margin-left: auto; font-size: 12.5px; color: var(--muted); }
  .who b { color: var(--ink); }
  .tabs { display: flex; gap: 6px; margin: 18px 0 14px; flex-wrap: wrap; }
  .tab {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 13.5px;
  }
  .tab.active { background: var(--brand-soft); border-color: #bfdbfe; color: var(--brand); font-weight: 600; }
  .grid { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; box-shadow: 0 1px 3px rgba(15, 23, 42, .04);
  }
  .card h2 { margin: 0 0 12px; font-size: 15px; font-weight: 650; }
  .card h2 .hint { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 8px; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font-size: 13.5px; background: #fff; color: var(--ink); outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37,99,235,.10); }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; min-width: 0; }
  input[type="datetime-local"] { min-width: 0; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid transparent; border-radius: 8px; padding: 8px 14px;
    font-size: 13px; cursor: pointer; font-weight: 550;
  }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.primary:hover { background: #1d4ed8; }
  .btn.ghost { background: #fff; border-color: var(--line); color: var(--ink); }
  .btn.ghost:hover { border-color: var(--brand); color: var(--brand); }
  .btn.green { background: var(--green); color: #fff; }
  .btn.red { background: var(--red); color: #fff; }
  .btn.small { padding: 4px 10px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .actions { margin-top: 14px; display: flex; gap: 8px; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item {
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: #fff;
  }
  .item .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .item .title { font-weight: 600; font-size: 14px; }
  .item .meta { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .item .purpose { margin-top: 6px; font-size: 13px; }
  .item .foot { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge {
    display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
    background: var(--gray-soft); color: #4b5563; white-space: nowrap;
  }
  .badge.amber { background: var(--amber-soft); color: var(--amber); }
  .badge.blue { background: var(--brand-soft); color: var(--brand); }
  .badge.green { background: var(--green-soft); color: var(--green); }
  .badge.red { background: var(--red-soft); color: var(--red); }
  .empty { color: var(--muted); text-align: center; padding: 22px 8px; font-size: 13px; }
  .toast {
    position: fixed; right: 22px; bottom: 22px; max-width: 420px; z-index: 50;
    background: #111827; color: #fff; padding: 11px 15px; border-radius: 10px; font-size: 13px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25); opacity: 0; transform: translateY(8px);
    transition: all .2s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.err { background: #991b1b; }
  .modal-mask {
    position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none;
    align-items: center; justify-content: center; z-index: 40; padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff; border-radius: 14px; max-width: 640px; width: 100%; max-height: 82vh;
    overflow: auto; padding: 20px 22px;
  }
  .modal h3 { margin: 0 0 4px; font-size: 16px; }
  .timeline { margin-top: 14px; border-left: 2px solid var(--line); padding-left: 14px; }
  .tl-item { margin-bottom: 12px; position: relative; }
  .tl-item::before {
    content: ""; position: absolute; left: -20px; top: 5px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--brand);
  }
  .tl-item .t { font-size: 12px; color: var(--muted); }
  .design { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .design { grid-template-columns: 1fr; } }
  pre.flow {
    background: #0f172a; color: #e2e8f0; padding: 14px 16px; border-radius: 10px;
    overflow: auto; font-size: 12px; line-height: 1.6;
  }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 13px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
  .toggle input { width: auto; }
  .warnbox {
    background: var(--amber-soft); border: 1px solid #fde68a; color: #92400e;
    padding: 10px 12px; border-radius: 8px; font-size: 12.5px; margin-bottom: 12px;
  }
</style>
</head>
<body>
<header>
  <h1>M2 整教室预约与审批 · 演示原型</h1>
  <div class="sub">两级审批 · 冲突检查 · 超时自动撤销 · M2 → M1 状态写回与失败重试</div>
  <div class="chips">
    <span class="chip"><span class="dot ok" id="dot-m2"></span>M2 服务</span>
    <span class="chip"><span class="dot" id="dot-m1"></span>M1 模拟服务</span>
    <span class="chip" id="chip-failure">故障注入：未知</span>
    <span class="chip" id="chip-version">版本：-</span>
  </div>
</header>

<div class="wrap">
  <div class="loginbar">
    <span class="label">演示身份：</span>
    <div id="login-users" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <span class="who" id="who">未登录</span>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>

<div class="modal-mask" id="modal-mask">
  <div class="modal" id="modal-body"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const state = {
  token: localStorage.getItem("m2_token") || "",
  user: JSON.parse(localStorage.getItem("m2_user") || "null"),
  tab: "applicant",
  rooms: [],
  runtime: null,
};

const USERS = [
  { id: "student1", label: "李同学" },
  { id: "student2", label: "王同学" },
  { id: "teacher1", label: "陈老师" },
  { id: "approver1", label: "一级审批人" },
  { id: "approver2", label: "二级审批人" },
  { id: "admin", label: "管理员" },
];

const STATUS = {
  PENDING_L1: { text: "待一级审批", cls: "amber" },
  PENDING_L2: { text: "待二级审批", cls: "blue" },
  APPROVED: { text: "已批准", cls: "green" },
  REJECTED: { text: "已驳回", cls: "red" },
  CANCELLED: { text: "已撤销", cls: "" },
  EXPIRED: { text: "超时撤销", cls: "" },
};
const SYNC = {
  PENDING: { text: "同步中", cls: "amber" },
  SUCCEEDED: { text: "已写回 M1", cls: "green" },
  FAILED: { text: "同步失败 · 自动重试", cls: "red" },
  DEAD: { text: "同步失败 · 需人工", cls: "red" },
  SKIPPED: { text: "已跳过", cls: "" },
};

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmt(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString("zh-CN", { hour12: false });
}
function badge(code, map) {
  const m = map[code] || { text: code || "-", cls: "" };
  return `<span class="badge ${m.cls}">${esc(m.text)}</span>`;
}
function toast(msg, isErr = false) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.className = "toast"; }, 3200);
}

async function api(path, options = {}) {
  const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
  if (state.token) headers.Authorization = `Bearer ${state.token}`;
  const resp = await fetch(path, { ...options, headers });
  if (resp.status === 204) return null;
  let data = null;
  try { data = await resp.json(); } catch (e) { data = null; }
  if (!resp.ok) {
    let msg = data && data.detail;
    if (typeof msg === "object") msg = msg.message || JSON.stringify(msg);
    throw new Error(`${resp.status} ${msg || resp.statusText}`);
  }
  return data;
}

function saveAuth(payload) {
  state.token = payload.access_token;
  state.user = payload.user;
  localStorage.setItem("m2_token", state.token);
  localStorage.setItem("m2_user", JSON.stringify(state.user));
}

async function login(username) {
  try {
    const payload = await api("/api/v1/auth/login", { method: "POST", body: JSON.stringify({ username }) });
    saveAuth(payload);
    toast(`已切换为：${payload.user.name}`);
    render();
  } catch (e) { toast(e.message, true); }
}

async function logout() {
  state.token = ""; state.user = null;
  localStorage.removeItem("m2_token"); localStorage.removeItem("m2_user");
  render();
}

function hasRole(...roles) { return !!state.user && state.user.roles.some(r => roles.includes(r)); }
function isAdmin() { return hasRole("admin"); }
function canApply() { return hasRole("student", "teacher", "admin"); }
function canApprove() { return hasRole("approver_l1", "approver_l2", "admin"); }

function availableTabs() {
  const tabs = [{ id: "applicant", label: "提交申请 / 我的申请" }];
  if (canApprove()) tabs.push({ id: "approver", label: "待审批" });
  if (isAdmin()) tabs.push({ id: "ops", label: "运维台（演示）" });
  tabs.push({ id: "design", label: "设计说明" });
  return tabs;
}

function renderLoginBar() {
  document.getElementById("login-users").innerHTML = USERS.map(u =>
    `<button class="userbtn ${state.user && state.user.id === u.id ? "active" : ""}" data-action="login" data-user="${u.id}">${esc(u.label)}</button>`
  ).join("");
  const who = document.getElementById("who");
  if (state.user) {
    who.innerHTML = `当前：<b>${esc(state.user.name)}</b> ` +
      state.user.roles.map(r => `<span class="badge">${esc(r)}</span>`).join(" ") +
      ` <button class="btn ghost small" data-action="logout" style="margin-left:6px">退出</button>`;
  } else {
    who.textContent = "未登录（点击上方身份切换）";
  }
}

function renderTabs() {
  const tabs = availableTabs();
  if (!tabs.some(t => t.id === state.tab)) state.tab = tabs[0].id;
  document.getElementById("tabs").innerHTML = tabs.map(t =>
    `<button class="tab ${state.tab === t.id ? "active" : ""}" data-action="tab" data-tab="${t.id}">${esc(t.label)}</button>`
  ).join("");
}

function appItem(a, opts = {}) {
  const st = STATUS[a.status] || { text: a.status, cls: "" };
  const sync = a.sync_status ? badge(a.sync_status, SYNC) : "";
  const actions = [];
  if (opts.mine && ["PENDING_L1", "PENDING_L2"].includes(a.status)) {
    actions.push(`<button class="btn ghost small" data-action="cancel" data-id="${a.id}">撤销申请</button>`);
  }
  if (opts.mine && a.status === "APPROVED" && new Date(a.start_time) > new Date()) {
    actions.push(`<button class="btn ghost small" data-action="cancel" data-id="${a.id}">撤销并释放</button>`);
  }
  if (opts.approve) {
    actions.push(`<button class="btn green small" data-action="approve" data-id="${a.id}">通过</button>`);
    actions.push(`<button class="btn red small" data-action="reject" data-id="${a.id}">驳回</button>`);
  }
  actions.push(`<button class="btn ghost small" data-action="detail" data-id="${a.id}">审批轨迹</button>`);
  return `<div class="item">
    <div class="top">
      <span class="title">${esc(a.room_name)}</span>
      ${badge(a.status, STATUS)}
      ${sync}
      ${opts.approve ? `<span class="badge blue">${a.status === "PENDING_L1" ? "一级" : "二级"}</span>` : ""}
    </div>
    <div class="meta">${fmt(a.start_time)} → ${fmt(a.end_time)} · 申请人：${esc(a.applicant_name)}</div>
    <div class="purpose">用途：${esc(a.purpose)}</div>
    ${a.reject_reason ? `<div class="meta">说明：${esc(a.reject_reason)}</div>` : ""}
    ${a.sync_last_error ? `<div class="meta" style="color:var(--red)">同步错误：${esc(a.sync_last_error)}</div>` : ""}
    <div class="meta">提交于 ${fmt(a.created_at)} · 审批时限至 ${fmt(a.expires_at)}</div>
    <div class="foot">${actions.join("")}</div>
  </div>`;
}

function roomLabel(room) {
  const area = room.area ? ` · ${room.area}` : "";
  const hours = (room.opens != null && room.closes != null) ? ` · ${room.opens}:00–${room.closes}:00` : "";
  const inactive = room.active === false ? " · 已停用" : "";
  return `${room.name}${area}${hours}${inactive}`;
}

async function renderApplicant() {
  const view = document.getElementById("view");
  const user = state.user;
  if (!user) { view.innerHTML = `<div class="card"><div class="empty">请先选择演示身份登录。</div></div>`; return; }
  if (!canApply()) {
    view.innerHTML = `<div class="card"><div class="empty">当前角色（${esc(user.roles.join(", "))}）没有提交申请的权限。<br>请切换到 李同学 / 王同学 / 陈老师。</div></div>`;
    return;
  }
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1); tomorrow.setHours(14, 0, 0, 0);
  const end = new Date(tomorrow); end.setHours(16, 0, 0, 0);
  const toLocalInput = d => {
    const p = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  const saved = state.appForm || {};

  let mine = [];
  try { mine = await api("/api/v1/applications/mine"); } catch (e) { toast(e.message, true); }
  let rooms = [];
  try { rooms = await api("/api/v1/rooms"); } catch (e) { toast(e.message, true); }

  view.innerHTML = `<div class="grid">
    <div class="card">
      <h2>提交整教室预约申请 <span class="hint">提交后进入一级审批</span></h2>
      <label>教室（来自 M1 主数据，通过 HTTP 读取）</label>
      <select id="f-room">${rooms.map(r => `<option value="${esc(r.id)}" ${saved.room === r.id ? "selected" : ""}>${esc(roomLabel(r))}</option>`).join("") || "<option value=''>M1 不可用</option>"}</select>
      <label>用途</label>
      <input id="f-purpose" placeholder="如：班级班会 / 社团活动 / 小组研讨" value="${esc(saved.purpose || "")}" />
      <div class="row">
        <div><label>开始</label><input type="datetime-local" id="f-start" value="${saved.start || toLocalInput(tomorrow)}" /></div>
        <div><label>结束</label><input type="datetime-local" id="f-end" value="${saved.end || toLocalInput(end)}" /></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="btn-submit" ${rooms.length ? "" : "disabled"}>提交申请</button>
        <button class="btn ghost" data-action="reset-form">重置</button>
      </div>
      <div class="warnbox" style="margin-top:14px;margin-bottom:0">
        演示提示：同一教室同一时段提交两份申请都可以进入审批；<b>第二份在二级审批时会被冲突检查拦截</b>。
      </div>
    </div>
    <div class="card">
      <h2>我的申请 <span class="hint">${mine.length} 条</span></h2>
      <div class="list">${mine.length ? mine.map(a => appItem(a, { mine: true })).join("") : '<div class="empty">还没有申请。先在左侧提交一条。</div>'}</div>
    </div>
  </div>`;

  const rememberForm = () => {
    state.appForm = {
      room: document.getElementById("f-room")?.value,
      purpose: document.getElementById("f-purpose")?.value,
      start: document.getElementById("f-start")?.value,
      end: document.getElementById("f-end")?.value,
    };
  };
  ["f-room", "f-purpose", "f-start", "f-end"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("input", rememberForm);
    if (el) el.addEventListener("change", rememberForm);
  });

  const submit = document.getElementById("btn-submit");
  if (submit) submit.addEventListener("click", async () => {
    const payload = {
      room_id: document.getElementById("f-room").value,
      purpose: document.getElementById("f-purpose").value.trim(),
      start_time: new Date(document.getElementById("f-start").value).toISOString(),
      end_time: new Date(document.getElementById("f-end").value).toISOString(),
    };
    if (!payload.purpose) return toast("请填写用途", true);
    submit.disabled = true;
    try {
      await api("/api/v1/applications", { method: "POST", body: JSON.stringify(payload) });
      toast("申请已提交，等待一级审批");
      renderApplicant();
    } catch (e) { toast(e.message, true); submit.disabled = false; }
  });
}

async function renderApprover() {
  const view = document.getElementById("view");
  if (!canApprove()) { view.innerHTML = `<div class="card"><div class="empty">当前角色没有审批权限。</div></div>`; return; }
  let pending = [];
  try { pending = await api("/api/v1/applications/pending"); } catch (e) { toast(e.message, true); }
  const roleText = isAdmin() ? "管理员视图：一级 + 二级待办" : (hasRole("approver_l1") ? "一级审批人：只看待一级审批" : "二级审批人：只看待二级审批");
  view.innerHTML = `<div class="card">
    <h2>待审批列表 <span class="hint">${roleText} · ${pending.length} 条</span></h2>
    <div class="list">${pending.length ? pending.map(a => appItem(a, { approve: true })).join("") : '<div class="empty">当前没有待办。</div>'}</div>
    <div class="warnbox" style="margin-top:14px;margin-bottom:0">
      演示提示：同一人不能完成两级审批；二级审批通过时会再次检查教室时段冲突，冲突则返回 409。
    </div>
  </div>`;
}

async function renderOps() {
  const view = document.getElementById("view");
  if (!isAdmin()) { view.innerHTML = `<div class="card"><div class="empty">需要管理员角色。</div></div>`; return; }
  let syncs = [], m1state = null;
  try { syncs = await api("/api/v1/sync"); } catch (e) { toast(e.message, true); }
  try { m1state = await api("/api/v1/ops/m1-state"); } catch (e) { toast(e.message, true); }
  const fail = !!(state.runtime && state.runtime.m1_failure_mode);
  const demoControls = !(state.runtime && state.runtime.m1 && state.runtime.m1.demo_controls === false);
  view.innerHTML = `<div class="grid">
    <div class="card">
      <h2>故障注入与定时任务</h2>
      ${demoControls ? `<label class="toggle"><input type="checkbox" id="chk-fail" ${fail ? "checked" : ""} /> 模拟 M1 座位写回接口不可用（503）</label>` : `<div class="warnbox">当前连接的是 A 的真实 M1，没有故障注入/重置接口；同步重试仍可演示。</div>`}
      <div class="actions" style="flex-wrap:wrap">
        <button class="btn ghost" data-action="run-sweep">立即执行超时扫描 + 重试</button>
        <button class="btn ghost" data-action="m1-personal-booking">在 M1 制造个人预约（演示冲突）</button>
        ${demoControls ? '<button class="btn ghost" data-action="m1-reset">重置 M1 占用数据</button>' : ""}
        <button class="btn ghost" data-action="refresh">刷新</button>
      </div>
      <div class="warnbox" style="margin-top:14px">
        演示脚本：先打开故障注入 → 审批通过 → 同步记录变红（M2 不会谎报成功）→ 关闭故障注入 → 点“立即执行”或等待后台任务 → 变绿。
      </div>
      <h2 style="margin-top:20px">M1 当前限制（只读）</h2>
      <div class="list">${m1state && m1state.restrictions && m1state.restrictions.length
        ? m1state.restrictions.map(o => `<div class="item">
            <div class="top"><span class="title">教室 ${esc(o.room_id)} · ${esc(o.source)}:${esc(o.external_id)}</span><span class="badge ${o.active ? "green" : ""}">${o.active ? "生效中" : "已解除"}</span></div>
            <div class="meta">${fmt(o.start + "+08:00")} → ${fmt(o.end + "+08:00")} <span class="hint">（北京时间）</span></div>
          </div>`).join("")
        : '<div class="empty">M1 当前没有 M2/M3 限制记录。</div>'}</div>
      <h2 style="margin-top:20px">M1 调用日志 <span class="hint">证明是真实网络调用</span></h2>
      <div class="list mono" style="font-size:11px">${m1state && m1state.call_log && m1state.call_log.length
        ? m1state.call_log.slice(0, 8).map(c => `<div>${esc(c.at)} · ${esc(c.event)} · ${esc(c.payload.room_id || c.payload.application_id)}</div>`).join("")
        : '<div class="empty">暂无调用。</div>'}</div>
    </div>
    <div class="card">
      <h2>跨模块同步记录（Outbox） <span class="hint">${syncs.length} 条</span></h2>
      <div style="overflow:auto">
      <table>
        <thead><tr><th>#</th><th>申请</th><th>动作</th><th>状态</th><th>尝试</th><th>错误</th><th></th></tr></thead>
        <tbody>${syncs.length ? syncs.map(s => `<tr>
          <td>${s.id}</td>
          <td class="mono">${esc(s.application_id.slice(0, 8))}…</td>
          <td>${esc(s.action)}</td>
          <td>${badge(s.status, SYNC)}</td>
          <td>${s.attempts}</td>
          <td style="max-width:180px;color:var(--red)">${esc(s.last_error || "")}</td>
          <td>${["FAILED", "DEAD"].includes(s.status) ? `<button class="btn ghost small" data-action="retry-sync" data-id="${s.id}">重试</button>` : ""}</td>
        </tr>`).join("") : '<tr><td colspan="7" class="empty">暂无同步记录。审批通过后会出现 OCCUPY 记录。</td></tr>'}</tbody>
      </table>
      </div>
      <div class="meta" style="margin-top:10px;color:var(--muted);font-size:12px">
        Outbox 与业务状态在同一事务写入；后台每 ${state.runtime ? "3" : "3"} 秒扫描待重试记录，最多 5 次，退避 2/4/8/16/32 秒。失败时申请仍显示“已批准”，但同步状态明确标注失败，不谎报成功。
      </div>
    </div>
  </div>`;
  const chk = document.getElementById("chk-fail");
  if (chk) chk.addEventListener("change", async () => {
    try {
      await api("/api/v1/ops/m1-failure", { method: "POST", body: JSON.stringify({ enabled: chk.checked }) });
      toast(chk.checked ? "已开启 M1 故障注入" : "已关闭 M1 故障注入");
      await refreshRuntime();
      renderOps();
    } catch (e) { toast(e.message, true); }
  });
}

function renderDesign() {
  document.getElementById("view").innerHTML = `<div class="design">
    <div class="card">
      <h2>审批状态机</h2>
      <pre class="flow">PENDING_L1 ──一级通过──▶ PENDING_L2 ──二级通过──▶ APPROVED
    │                        │                        │
    ├─一级驳回─▶ REJECTED     ├─二级驳回─▶ REJECTED     └─开始前撤销─▶ CANCELLED
    ├─申请人撤销─▶ CANCELLED   ├─申请人撤销─▶ CANCELLED            （并写回释放）
    └─超时────▶ EXPIRED      └─超时────▶ EXPIRED</pre>
      <dl class="kv" style="margin-top:14px">
        <dt>权限门槛</dt><dd>提交：student / teacher；一级：approver_l1；二级：approver_l2；管理员可代审但不能同一人完成两级</dd>
        <dt>冲突检查</dt><dd>提交时检查已批准占用；二级审批前在教室行锁内检查 M2 数据库，并调用 M1 <span class="mono">GET /api/seats</span> 预检个人预约/M2/M3 限制</dd>
        <dt>超时撤销</dt><dd>提交时写入 expires_at；后台定时任务扫描并置为 EXPIRED，不依赖页面刷新</dd>
        <dt>跨模块写回</dt><dd>审批通过与 outbox 记录同事务落库；后台调用 M1 的 <span class="mono">/api/integrations/restrictions</span>，失败指数退避重试；4xx 直接置 DEAD 不空转</dd>
      </dl>
    </div>
    <div class="card">
      <h2>M2 → M1 调用链</h2>
      <pre class="flow">浏览器
  │  POST /api/v1/applications/{id}/approve
  ▼
M2 (FastAPI) ── 状态机 + 冲突检查 + M1 预检 ──▶ M2 PostgreSQL
  │                                  ├─ applications
  │                                  ├─ approval_records
  │                                  └─ sync_records (OCCUPY, PENDING)
  ▼  后台任务 / 手动触发
M2 Outbox Worker ──POST /api/integrations/restrictions──▶ M1 (A 的实现)
                                                    └─ M2:application_id 限制生效
     失败：sync_records = FAILED / DEAD，页面可见，可重试</pre>
      <h2 style="margin-top:18px">明天需要一起确认的问题</h2>
      <ol style="margin:0;padding-left:20px;font-size:13px;line-height:1.8">
        <li>两级审批的角色命名与 RBAC 由 C 统一定义，M2 只做接口级校验</li>
        <li>M1 公开接口的最终路径与幂等键（当前：application_id）</li>
        <li>提交阶段是否允许「时段冲突的申请」并存（当前允许，审批时裁决）</li>
        <li>M2 占用的是教室全部座位，是否需要记录 seat 粒度（当前按整教室）</li>
        <li>生产环境审批时限、提醒方式与超时后的通知归属</li>
        <li>部署服务器与 GitHub Environment 审批人</li>
      </ol>
      <div class="actions">
        <a class="btn ghost" href="/docs" target="_blank">打开 Swagger</a>
        <a class="btn ghost" href="/api/v1/auth/demo-users" target="_blank">演示账号 API</a>
      </div>
    </div>
  </div>`;
}

async function showDetail(id) {
  const mask = document.getElementById("modal-mask");
  const body = document.getElementById("modal-body");
  try {
    const [app, records] = await Promise.all([
      api(`/api/v1/applications/${id}`),
      api(`/api/v1/applications/${id}/approvals`),
    ]);
    body.innerHTML = `<h3>${esc(app.room_name)} ${badge(app.status, STATUS)}</h3>
      <div class="meta" style="color:var(--muted)">${fmt(app.start_time)} → ${fmt(app.end_time)} · ${esc(app.applicant_name)}</div>
      <div class="meta">用途：${esc(app.purpose)}</div>
      <div class="meta">申请 ID：<span class="mono">${esc(app.id)}</span></div>
      <h3 style="margin-top:18px;font-size:14px">审批轨迹</h3>
      <div class="timeline">${records.map(r => `<div class="tl-item">
        <div><b>${esc(r.action)}</b> · ${esc(r.approver_name)} ${r.level ? `（${r.level} 级）` : ""}</div>
        <div class="t">${fmt(r.created_at)}</div>
        ${r.comment ? `<div>${esc(r.comment)}</div>` : ""}
      </div>`).join("")}</div>
      <div class="actions"><button class="btn ghost" data-action="close-modal">关闭</button></div>`;
    mask.classList.add("show");
  } catch (e) { toast(e.message, true); }
}

function closeModal() { document.getElementById("modal-mask").classList.remove("show"); }

async function approve(id) {
  const comment = prompt("审批意见（可留空）：", "同意");
  if (comment === null) return;
  try {
    await api(`/api/v1/applications/${id}/approve`, { method: "POST", body: JSON.stringify({ comment }) });
    toast("审批已通过");
    render();
  } catch (e) { toast(e.message, true); }
}

async function reject(id) {
  const comment = prompt("驳回原因：", "时段或用途不符合要求");
  if (comment === null) return;
  try {
    await api(`/api/v1/applications/${id}/reject`, { method: "POST", body: JSON.stringify({ comment }) });
    toast("已驳回");
    render();
  } catch (e) { toast(e.message, true); }
}

async function cancel(id) {
  const reason = prompt("撤销原因（可留空）：", "行程变更");
  if (reason === null) return;
  try {
    const app = await api(`/api/v1/applications/${id}/cancel`, { method: "POST", body: JSON.stringify({ reason }) });
    toast(app.status === "APPROVED" ? "已撤销" : `申请状态：${app.status}`);
    render();
  } catch (e) { toast(e.message, true); }
}

async function retrySync(id) {
  try {
    const rec = await api(`/api/v1/sync/${id}/retry`, { method: "POST", body: "{}" });
    toast(`重试结果：${rec.status}`);
    render();
  } catch (e) { toast(e.message, true); }
}

async function runSweep() {
  try {
    const r = await api("/api/v1/ops/run-sweep", { method: "POST", body: "{}" });
    toast(`扫描完成：超时 ${r.expired}，同步尝试 ${r.sync_attempted}，成功 ${r.sync_succeeded}，失败 ${r.sync_failed}`);
    render();
  } catch (e) { toast(e.message, true); }
}

async function resetM1() {
  if (!confirm("确定清空 M1 模拟服务的占用数据？")) return;
  try { await api("/api/v1/ops/m1-reset", { method: "POST", body: "{}" }); toast("M1 模拟数据已重置"); render(); }
  catch (e) { toast(e.message, true); }
}

async function createM1PersonalBooking() {
  const room = (state.appForm && state.appForm.room) || "1";
  const start = new Date(); start.setDate(start.getDate() + 1); start.setHours(14, 0, 0, 0);
  const end = new Date(start); end.setHours(16, 0, 0, 0);
  if (!confirm(`将在 M1 的教室 ${room} 创建个人预约：明天 14:00–16:00。继续？`)) return;
  try {
    await api("/api/v1/ops/m1-personal-booking", {
      method: "POST",
      body: JSON.stringify({ room_id: room, start_time: start.toISOString(), end_time: end.toISOString() }),
    });
    toast("已在 M1 创建个人预约。现在提交同教室、同时段的申请，二级审批会被 409 拦截。");
    render();
  } catch (e) { toast(e.message, true); }
}

async function refreshRuntime() {
  try {
    state.runtime = await api("/api/v1/meta/runtime");
    document.getElementById("dot-m1").className = "dot " + (state.runtime.m1_reachable ? "ok" : "bad");
    const chip = document.getElementById("chip-failure");
    if (state.runtime.m1 && state.runtime.m1.demo_controls === false) {
      chip.textContent = "M1：A 的真实服务";
      chip.style.background = "rgba(74,222,128,.28)";
    } else {
      chip.textContent = state.runtime.m1_failure_mode === null ? "故障注入：M1 不可达"
        : `故障注入：${state.runtime.m1_failure_mode ? "开启" : "关闭"}`;
      chip.style.background = state.runtime.m1_failure_mode ? "rgba(248,113,113,.28)" : "rgba(255,255,255,.15)";
    }
  } catch (e) {
    document.getElementById("dot-m1").className = "dot bad";
  }
  try {
    const v = await api("/version");
    document.getElementById("chip-version").textContent = `版本：${v.git_sha}`;
  } catch (e) {}
}

async function render() {
  renderLoginBar();
  renderTabs();
  const view = document.getElementById("view");
  if (!state.user) { view.innerHTML = `<div class="card"><div class="empty">请先选择演示身份登录。</div></div>`; return; }
  if (state.tab === "applicant") await renderApplicant();
  else if (state.tab === "approver") await renderApprover();
  else if (state.tab === "ops") await renderOps();
  else renderDesign();
}

document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "login") await login(el.dataset.user);
  else if (a === "logout") await logout();
  else if (a === "tab") { state.tab = el.dataset.tab; render(); }
  else if (a === "detail") await showDetail(el.dataset.id);
  else if (a === "approve") await approve(el.dataset.id);
  else if (a === "reject") await reject(el.dataset.id);
  else if (a === "cancel") await cancel(el.dataset.id);
  else if (a === "retry-sync") await retrySync(el.dataset.id);
  else if (a === "run-sweep") await runSweep();
  else if (a === "m1-personal-booking") await createM1PersonalBooking();
  else if (a === "m1-reset") await resetM1();
  else if (a === "refresh") render();
  else if (a === "reset-form") renderApplicant();
  else if (a === "close-modal") closeModal();
});
document.getElementById("modal-mask").addEventListener("click", (ev) => {
  if (ev.target.id === "modal-mask") closeModal();
});

(async function init() {
  const params = new URLSearchParams(location.search);
  const wantedUser = params.get("user");
  const wantedTab = params.get("tab");
  if (wantedTab) state.tab = wantedTab;

  await refreshRuntime();
  if (wantedUser) {
    try {
      const payload = await api("/api/v1/auth/login", { method: "POST", body: JSON.stringify({ username: wantedUser }) });
      saveAuth(payload);
    } catch (e) { toast(e.message, true); }
  } else if (!state.user) {
    // 演示默认登录申请人，打开即可操作
    try {
      const payload = await api("/api/v1/auth/login", { method: "POST", body: JSON.stringify({ username: "student1" }) });
      saveAuth(payload);
    } catch (e) {}
  }
  await render();
  setInterval(async () => {
    await refreshRuntime();
    if (["applicant", "approver", "ops"].includes(state.tab)) render();
  }, 4000);
})();
</script>
</body>
</html>
