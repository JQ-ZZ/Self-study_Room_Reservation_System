name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/services/m2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/services/m2/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest --junitxml=test-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-test-report
          path: backend/services/m2/test-report.xml
          if-no-files-found: ignore

  migrations:
    name: migrate from empty database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: m2_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d m2_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend/services/m2
    env:
      M2_DATABASE_URL: postgresql+psycopg2://app:app@localhost:5432/m2_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/services/m2/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: upgrade empty database
        run: alembic upgrade head
      - name: detect model/migration drift
        run: alembic check

  compose-smoke:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: [lint-test]
    steps:
      - uses: actions/checkout@v4
      - name: start stack
        run: docker compose -f deploy/compose.yml up -d --build
      - name: smoke test
        run: python3 scripts/smoke.py
      - name: logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yml logs --no-color
      - name: shutdown
        if: always()
        run: docker compose -f deploy/compose.yml down -v
